name: Full CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-linux:
    name: Full scaffold matrix (Linux ARM64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Scaffold, build, test, and pack
        shell: pwsh
        run: |
          foreach ($archetype in @('tool', 'library')) {
            foreach ($testRunner in @('mstest', 'xunit')) {
              ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1 `
                -Archetype $archetype `
                -TestRunner $testRunner `
                -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'
            }
          }

  scaffold-linux-x64:
    name: Full scaffold matrix (Linux x64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Scaffold, build, test, and pack
        shell: pwsh
        run: |
          foreach ($archetype in @('tool', 'library')) {
            foreach ($testRunner in @('mstest', 'xunit')) {
              ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1 `
                -Archetype $archetype `
                -TestRunner $testRunner `
                -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'
            }
          }

  scaffold-windows:
    name: Full scaffold matrix (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Scaffold, build, test, and pack
        shell: pwsh
        run: |
          foreach ($archetype in @('tool', 'library', 'multi-target')) {
            foreach ($testRunner in @('mstest', 'xunit')) {
              ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1 `
                -Archetype $archetype `
                -TestRunner $testRunner `
                -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'
            }
          }

  scaffold-preview:
    name: Preview SDK scaffold canary
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Exercise next SDK
        shell: pwsh
        run: >-
          ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1
          -Archetype library
          -TestRunner mstest
          -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'