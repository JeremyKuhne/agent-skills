name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match tag to plugin version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a valid release tag."
          }

          $pluginVersion = [string](Get-Content plugin.json -Raw | ConvertFrom-Json).version
          $marketplace = Get-Content .github/plugin/marketplace.json -Raw | ConvertFrom-Json
          $marketplaceVersion = [string]$marketplace.metadata.version
          $pluginName = [string](Get-Content plugin.json -Raw | ConvertFrom-Json).name
          $marketplaceEntries = @($marketplace.plugins | Where-Object name -CEQ $pluginName)

          if ($marketplaceEntries.Count -ne 1) {
            throw "Expected exactly one marketplace plugin named '$pluginName'."
          }

          $expectedTag = "v$pluginVersion"
          if ($tag -cne $expectedTag) {
            throw "plugin.json version '$pluginVersion' does not match tag '$tag'."
          }
          if ($marketplaceVersion -cne $pluginVersion) {
            throw "Marketplace metadata version '$marketplaceVersion' does not match '$pluginVersion'."
          }
          if ([string]$marketplaceEntries[0].version -cne $pluginVersion) {
            throw "Marketplace plugin version '$($marketplaceEntries[0].version)' does not match '$pluginVersion'."
          }

  validate:
    name: Validate skills, format, and links
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate agent instruction mirror
        shell: pwsh
        run: ./tools/Validate-AgentFiles.ps1

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules
          config: .markdownlint.jsonc

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --offline
            "**/*.md"
          fail: true

      - name: Validate portfolio metadata and overlays
        shell: pwsh
        run: ./skills/manage-skills/scripts/Validate-Skills.ps1 ./skills -RequirePortfolioMetadata

      - name: Validate source skills (skills-ref 0.1.5)
        shell: bash
        run: |
          shopt -s nullglob
          dirs=(skills/*/)
          if (( ${#dirs[@]} == 0 )); then
            echo "No source skills found under skills/." >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "Validating $dir"
            npx --yes skills-ref@0.1.5 validate "$dir"
          done

      - name: Install Copilot CLI 1.0.63
        run: npm install --global @github/copilot@1.0.63

      - name: Install and inspect plugin
        shell: pwsh
        run: ./tests/plugin/Invoke-PluginSmoke.ps1

      - name: Exercise synthetic consumer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_PIN: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:SOURCE_REF_TYPE -eq 'tag') {
            ./tests/repository/Invoke-SyntheticConsumer.ps1 `
              -SourceRepository $env:SOURCE_REPOSITORY `
              -Pin $env:SOURCE_PIN
          }
          else {
            ./tests/repository/Invoke-SyntheticConsumer.ps1
          }

  dotnet-pipes:
    name: .NET pipes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build sample and run fact tests
        run: >-
          dotnet test --project ./tests/dotnet-pipes/DotNetPipes.Tests.csproj
          --configuration Release

  scaffold-linux:
    name: Scaffold (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Scaffold, build, test, and pack
        shell: pwsh
        run: |
          $cases = @(
            @{ Archetype = 'tool'; TestRunner = 'mstest' }
            @{ Archetype = 'tool'; TestRunner = 'xunit' }
            @{ Archetype = 'library'; TestRunner = 'mstest' }
            @{ Archetype = 'library'; TestRunner = 'xunit' }
          )

          foreach ($case in $cases) {
            ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1 `
              @case `
              -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'
          }

  scaffold-windows:
    name: Scaffold (Windows multi-target)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Detect Windows filesystem skill changes
        id: windows-filesystem
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $affected = $env:GITHUB_REF -like 'refs/tags/*'
          if (-not $affected) {
            if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0+$') {
              $affected = $true
            }
            else {
              git fetch --no-tags --depth=1 origin $env:BASE_SHA
              if ($LASTEXITCODE -ne 0) {
                throw "Could not fetch base commit $env:BASE_SHA."
              }

              $changedPaths = @(git diff --name-only $env:BASE_SHA $env:GITHUB_SHA)
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not determine changed paths.'
              }

              $affected = @($changedPaths | Where-Object {
                      $_ -match '^(skills|tests)/(windows-acls|dotnet-file-creation)/' -or
                      $_ -eq '.github/workflows/ci.yml'
                  }).Count -gt 0
            }
          }

          "affected=$($affected.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install Pester for Windows filesystem facts
        if: steps.windows-filesystem.outputs.affected == 'true'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Windows filesystem fact tests
        if: steps.windows-filesystem.outputs.affected == 'true'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = @('tests/windows-acls', 'tests/dotnet-file-creation')
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Scaffold, build, test, and pack
        shell: pwsh
        run: |
          foreach ($testRunner in @('mstest', 'xunit')) {
            ./tests/engineering-baseline/Invoke-ScaffoldCanary.ps1 `
              -Archetype multi-target `
              -TestRunner $testRunner `
              -SdkVersion '${{ steps.dotnet.outputs.dotnet-version }}'
          }
