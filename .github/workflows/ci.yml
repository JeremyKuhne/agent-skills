name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills, format, and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: |
            **/*.md
            !node_modules
          config: .markdownlint.jsonc

      - name: Link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --offline
            "**/*.md"
          fail: true

      - name: Detect skills
        id: skills
        shell: bash
        run: |
          if compgen -G ".agents/skills/*/SKILL.md" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No SKILL.md files yet (skeleton stage); skipping skills-ref validate."
          fi

      # The agentskills.io reference validator. Runs only once real skills exist
      # (rollout Phase 3). Confirm the exact distribution / package name when the
      # first skill is migrated in; this step is intentionally inert until then.
      - name: Validate skill spec (skills-ref)
        if: steps.skills.outputs.present == 'true'
        shell: bash
        run: |
          for dir in .agents/skills/*/; do
            echo "Validating $dir"
            npx --yes skills-ref validate "$dir"
          done

  scripts:
    name: Script tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
